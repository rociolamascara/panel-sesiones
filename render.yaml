databases:
  - name: panel-sesiones-db
    databaseName: panel_sesiones
    databaseUser: dbuser

services:
  - type: web
    name: panel-sesiones-backend
    env: python
    buildCommand: "pip install fastapi uvicorn sqlalchemy psycopg2-binary pydantic python-dotenv"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: panel-sesiones-db
          property: connectionString
